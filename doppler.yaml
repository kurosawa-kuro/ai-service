setup:
  project: apps
  config: dev

# この repo が参照する Doppler は private-app workspace の `apps/dev`。
# 作業前に `doppler whoami` で WORKPLACE=private-app を確認する
# （kuro-dev workspace にも同名の `apps` があり、ログイン先で解決先が変わる）。
#
# 【鍵カタログをここに写さないこと】
# 鍵名・用途・消費アプリの正本は private-ops 側の 1 箇所だけ:
#   private-ops/docs/repos/env/doppler-apps/specs/仕様書.md（§1 命名規則 / §2 レジストリ / §6 消費者台帳）
#
# 2026-08-07 の棚卸しで、このファイルには 2026-06-12 時点の 25 鍵スナップショット
# （Turso 時代・hermes-n8n 前提）がコメントとして残っていた。退役済みの鍵 4 件について
# 「まだ参照されている」ように見える唯一の grep ヒット源がこの写しで、実行コードからの
# 参照は 0 件だった（該当鍵は同日に Doppler から削除済み）。
# 教訓: 写しは鍵名の grep を汚して棚卸しを狂わせる。ここに鍵名を列挙し直さないこと。
#
# 初期化: doppler setup --project apps --config dev --no-interactive
